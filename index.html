<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex,nofollow">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/dragon-express-test/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dragon Express — نظام إدارة الشحن والمناديب">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dragon Express">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">

  <!-- Favicon
       ⚠️ المتصفح بيخزّن الأيقونة بعناد أشد من الكاش العادي. الـ?v= بيخليه
       يعتبرها ملف جديد. لو غيّرت اللوجو تاني، زوّد الرقم. -->
  <link rel="icon" type="image/png" href="favicon.png?v=3"/>

  <title>🧪 [تجريبي] Dragon Express</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#060D18">
  <!-- ⚡ §3-92: شاشة تحميل خفيفة لحد أول فريم من فلاتر — بدل الصفحة البيضا
       اللي كانت بتظهر ثواني على النت البطيء. بتتشال لوحدها مع أول فريم. -->
  <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#11233B,#060D18 70%);font-family:system-ui,sans-serif">
    <img src="icons/Icon-192.png?v=3" width="132" height="132" alt="Dragon Express">
    <div style="color:#EAF2FB;font-weight:800;letter-spacing:1px">Dragon Express</div>
    <div style="width:120px;height:3px;border-radius:3px;background:#1C3554;overflow:hidden"><div style="width:40%;height:100%;background:#F5922B;animation:bt 1.1s ease-in-out infinite"></div></div>
    <style>@keyframes bt{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}</style>
  </div>
  <script>(function(){function off(){var b=document.getElementById("boot");if(b)b.remove();}
    window.addEventListener("flutter-first-frame",off);
    // احتياطي: لو الحدث ماوصلش، نشيلها بعد ما فلاتر يحط الـview بشوية، وبحد أقصى ٢٠ ثانية
    new MutationObserver(function(m,o){if(document.querySelector("flutter-view,flt-glass-pane")){o.disconnect();setTimeout(off,1500);}}).observe(document.body,{childList:true});
    setTimeout(off,20000);})();</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
