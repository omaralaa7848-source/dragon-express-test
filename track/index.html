<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>(function(){var p=location.pathname,i=p.indexOf('/t/');if(i>=0)document.write('<base href="'+p.slice(0,i+1)+'">');})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3F5F9">
<title>شحنتك — Dragon Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
/* ── «الخريطة الأول» — فاتح، زجاجي، باترن قشور التنين ── */
:root{--bg:#F3F5F9;--ink:#0F1B2D;--mute:#64748B;--line:rgba(15,27,45,.08);--flame:#F2762E;--flame2:#FF9A4D;--gold:#C98A12;
--ok:#14A06A;--bad:#E5484D;--info:#2F7FD6;--card:rgba(255,255,255,.84);--ease:cubic-bezier(.22,1,.36,1);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,sans-serif}
body{min-height:100vh;background-color:var(--bg);
  background-image:
    radial-gradient(120% 60% at 50% 0%,rgba(242,118,46,.10),transparent 60%),
    radial-gradient(circle at 50% 0,transparent 10px,rgba(242,118,46,.075) 11px,transparent 12.5px),
    radial-gradient(circle at 50% 0,transparent 10px,rgba(242,118,46,.075) 11px,transparent 12.5px);
  background-size:100% 100%,26px 14px,26px 14px;background-position:0 0,0 0,13px 7px;background-attachment:fixed}
button,input,textarea,select{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.test{position:sticky;top:0;z-index:900;background:repeating-linear-gradient(135deg,#F6CF5A 0 14px,#EDBB35 14px 28px);color:#2A1C00;text-align:center;font-weight:900;font-size:12.5px;padding:5px}
.shell{max-width:520px;margin:0 auto;position:relative}

/* الخريطة فوق */
.hero{position:relative;z-index:1;height:290px;border-radius:0 0 30px 30px;overflow:hidden;background:#E7ECF3;box-shadow:0 10px 30px rgba(15,27,45,.10)}
#hmap{position:absolute;inset:0;opacity:0;transition:opacity .9s var(--ease)}
#hmap.on{opacity:1}
.hero:after{content:"";position:absolute;inset:auto 0 0 0;height:90px;background:linear-gradient(to top,rgba(243,245,249,.95),rgba(243,245,249,0));pointer-events:none;z-index:450}
.top{position:absolute;top:12px;inset-inline:12px;z-index:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:5px 14px 5px 5px;box-shadow:0 6px 18px rgba(15,27,45,.14)}
.logo img{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(242,118,46,.55)}
.logo b{font-size:15px;font-weight:900;letter-spacing:.2px;white-space:nowrap}
.logo b span{color:var(--flame)}
.pill{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;direction:ltr;box-shadow:0 6px 18px rgba(15,27,45,.12);white-space:nowrap}
.setloc{position:absolute;z-index:500;left:50%;top:52%;translate:-50% -50%;background:var(--flame);color:#fff;border:0;border-radius:999px;padding:11px 18px;font-weight:900;font-size:14px;box-shadow:0 10px 26px rgba(242,118,46,.45);animation:bob 2.4s var(--ease) infinite}
@keyframes bob{50%{translate:-50% calc(-50% - 5px)}}
.pinI{width:34px;height:44px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}

.wrap{position:relative;z-index:2;margin-top:-34px;padding:0 14px 40px;display:flex;flex-direction:column;gap:12px}
#app{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.95);border-radius:22px;padding:14px 15px;box-shadow:0 8px 26px rgba(15,27,45,.07)}
.hi{padding:2px 4px 0}.hi h1{margin:0;font-size:24px;font-weight:900;line-height:1.35}.hi h1 span{color:var(--flame)}
.hi p{margin:2px 0 0;color:var(--mute);font-size:14px;font-weight:700}

/* شريط الخطوات */
.steps{display:flex;justify-content:space-between;position:relative;padding:4px 6px 2px}
.steps:before,.steps i{content:"";position:absolute;top:21px;inset-inline:12%;height:4px;border-radius:4px;background:#E3E8F0}
.steps i{inset-inline-end:auto;width:0;background:linear-gradient(90deg,var(--flame2),var(--flame));transition:width 1.1s var(--ease) .25s}
.st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;width:25%;font-size:12px;font-weight:800;color:var(--mute)}
.st b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #E3E8F0;font-size:16px;transition:.5s var(--ease)}
.st.done b{background:var(--flame);border-color:var(--flame);color:#fff}
.st.done{color:var(--ink)}
.st.now b{box-shadow:0 0 0 6px rgba(242,118,46,.18);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(242,118,46,.06)}}

.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;padding:6px 0}
.row+.row{border-top:1px solid var(--line)}
.row span{color:var(--mute);font-weight:700}.row b{text-align:left;font-weight:800}
.amt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:8px}
.amt small{display:block;color:var(--mute);font-size:12px;font-weight:700}
.amt .big{font-size:30px;font-weight:900;color:var(--flame);line-height:1;white-space:nowrap}.amt .big em{font-style:normal;font-size:15px;margin-inline-start:3px}
.banner{border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.75;font-weight:700}
.y{background:#FFF6E0;border:1px solid #F5D78A;color:#7A5300}
.r{background:#FFF0F0;border:1px solid #F6B8BA;color:#9B1C20}
.i{background:#EAF3FF;border:1px solid #B9D6F7;color:#174A85}
.g{background:#E8F8F0;border:1px solid #A9E3C8;color:#0D6B47}
.courier{display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--flame2),var(--flame));display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;box-shadow:0 6px 14px rgba(242,118,46,.35)}
.courier .who{flex:1;min-width:0}.courier .who b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.courier .who small{color:var(--mute);font-size:12.5px;font-weight:700}
.call{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:#E8F8F0;color:var(--ok);font-size:20px;text-decoration:none;border:1px solid #A9E3C8}
.sec{font-size:14px;font-weight:900;margin:6px 4px -2px}.sec small{color:var(--mute);font-weight:700}
.opt{display:flex;align-items:center;gap:12px}
.opt .ic{width:42px;height:42px;flex:none;border-radius:14px;background:#F3F5F9;display:grid;place-items:center;font-size:19px}
.opt>div:nth-child(2){flex:1;min-width:0}.opt .t{font-weight:900;font-size:14.5px}
.opt small{display:block;color:var(--mute);font-size:12.5px;line-height:1.65;font-weight:600;overflow-wrap:anywhere}
.opt.set{border-color:#A9E3C8}.opt.set .ic{background:#E8F8F0}
.tag{font-size:10.5px;color:var(--mute);background:#F1F4F8;border-radius:20px;padding:1px 8px;margin-inline-start:5px;font-weight:800}
.req{font-size:10.5px;font-weight:900;color:#fff;background:var(--flame);border-radius:20px;padding:1px 8px;margin-inline-start:5px}
.prev{display:block;margin-top:3px;color:#B4580F;font-weight:800;font-size:12px}
.link{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:900;flex:none;box-shadow:0 2px 6px rgba(15,27,45,.05)}
.lk{color:var(--mute);font-size:13px;flex:none}
.btn{width:100%;border:0;border-radius:18px;padding:15px;font-size:16px;font-weight:900;transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:scale(.98)}
.b-ok{background:linear-gradient(135deg,#1BC285,var(--ok));color:#fff;box-shadow:0 10px 24px rgba(20,160,106,.32)}
.b-flame{background:linear-gradient(135deg,var(--flame2),var(--flame));color:#fff;box-shadow:0 10px 24px rgba(242,118,46,.32)}
.b-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.b-bad{background:#fff;border:1px solid #F6B8BA;color:var(--bad)}.b-badx{background:var(--bad);color:#fff}
.btn:disabled{opacity:.55}
.hint{font-size:12.5px;color:var(--mute);text-align:center;margin:8px 0 0;line-height:1.7;font-weight:600}
.danger{margin-top:6px;text-align:center}
.danger p{margin:0 0 6px;font-size:12.5px;color:var(--mute);font-weight:700}
.cx{background:none;border:0;color:var(--bad);font-size:14px;font-weight:900;text-decoration:underline;text-underline-offset:4px;padding:6px}
.hero-msg{text-align:center;padding:24px 16px}.hero-msg .em{font-size:46px}.hero-msg h2{margin:8px 0 4px;font-size:21px;font-weight:900}.hero-msg p{margin:0;color:var(--mute);font-size:14px;line-height:1.75;font-weight:600}
.ev{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px;color:var(--mute)}
.ev li{padding:7px 18px 7px 0;position:relative;font-weight:600}.ev li:before{content:"";position:absolute;right:3px;top:14px;width:8px;height:8px;border-radius:50%;background:#D5DCE6}
.ev li:first-child:before{background:var(--flame)}.ev b{color:var(--ink);font-weight:800}
.stars{display:flex;gap:6px;justify-content:center;margin:6px 0}
.stars button{background:none;border:0;font-size:34px;color:#D5DCE6;padding:0 2px;transition:transform .2s var(--ease),color .2s}.stars button.on{color:#F5B301;transform:scale(1.12)}
textarea,input[type=text],input[type=tel]{width:100%;background:#F6F8FB;border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0 10px}
textarea{min-height:84px;resize:vertical}
.lbl{display:block;font-size:12.5px;color:var(--mute);margin-top:4px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 10px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800}
.chip[aria-pressed=true]{border-color:var(--flame);color:#B4580F;background:#FFF2E8}
.chip:disabled{opacity:.4}
.ft{display:flex;gap:8px;align-items:center;margin:6px 0 12px;font-weight:800}.ft select{flex:1;background:#F6F8FB;border:1px solid var(--line);border-radius:14px;padding:11px}

/* الشيت بيطلع من تحت بنعومة */
.sheet-bg{position:fixed;inset:0;background:rgba(15,27,45,.38);z-index:960;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:961;max-width:520px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .45s var(--ease),visibility .45s;box-shadow:0 -10px 40px rgba(15,27,45,.18)}
.sheet:before{content:"";display:block;width:42px;height:5px;border-radius:5px;background:#DDE3EB;margin:0 auto 12px}
.open .sheet-bg{opacity:1;visibility:visible}.open .sheet{transform:none;visibility:visible}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:900}.sheet p{margin:0 0 12px;color:var(--mute);font-size:13.5px;line-height:1.7;font-weight:600}
.sum{display:grid;gap:6px;margin:4px 0 12px}.sum div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:9px 11px;border-radius:12px;background:#F6F8FB}
.sum span{color:var(--mute);flex:none;font-weight:700}.sum b{text-align:left;overflow-wrap:anywhere}
#map{height:300px;border-radius:18px;position:relative;margin:6px 0 10px;overflow:hidden}
.pin{position:absolute;left:50%;top:50%;z-index:500;width:34px;height:44px;margin:-44px 0 0 -17px;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.sg button{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;font-size:13.5px;font-weight:700}
.gps{margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:24px;z-index:990;background:#0F1B2D;color:#fff;border-radius:16px;padding:12px 18px;font-size:14px;font-weight:800;max-width:90vw;box-shadow:0 12px 30px rgba(15,27,45,.3);
  transform:translate(-50%,30px);opacity:0;visibility:hidden;transition:transform .4s var(--ease),opacity .3s,visibility .4s}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}.toast.bad{background:#9B1C20}

/* تحميل انسيابي: هيكل بيلمع ثم الكروت بتدخل ورا بعض */
.sk{border-radius:22px;background:linear-gradient(100deg,#E6EBF2 20%,#F7F9FC 40%,#E6EBF2 60%) 0 0/300% 100%;animation:sh 1.6s ease-in-out infinite}
.hero .sk{position:absolute;inset:0;border-radius:0}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.in>*{animation:up .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.7)!important}
.hero .leaflet-top.leaflet-left{top:58px}
</style>
</head>
<body>
<div class="test" id="testbar" style="display:none">🧪 نسخة تجريبية — بيانات وهمية — مش للعملاء</div>
<div class="shell">
  <div class="hero" id="hero">
    <div class="sk" id="hsk"></div>
    <div id="hmap"></div>
    <div class="top">
      <div class="logo"><img src="logo.webp" alt="Dragon Express"><b>Dragon <span>Express</span></b></div>
      <div class="pill" id="code" style="display:none"></div>
    </div>
  </div>
  <div class="wrap">
    <div id="app">
      <div class="sk" style="height:62px;width:70%"></div>
      <div class="sk" style="height:96px"></div>
      <div class="sk" style="height:120px"></div>
      <div class="sk" style="height:74px"></div>
      <div class="sk" style="height:74px"></div>
    </div>
  </div>
</div>
<div id="sh"><div class="sheet-bg" id="shBg"></div><div class="sheet" role="dialog" aria-modal="true"><div id="shBody"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>if(window.TRK_STAGING){document.getElementById('testbar').style.display='';document.title='🧪 [تجريبي] '+document.title;}</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="map.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
// اللينك: …/t/CODE (الجديد) أو …?k=CODE (القديم)
const tok=new URLSearchParams(location.search).get('k')||((location.pathname.match(/\/t\/([A-Za-z0-9_-]{10,40})/)||[])[1])||'';
let D=null, busy=false, first=true, hmap=null, hmark=null;
const fmt=n=>Number(n||0).toLocaleString('ar-EG');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=h=>{h=+h;return fmt(h>12?h-12:h)+(h<12?' الصبح':h<15?' الضهر':h<18?' العصر':' بالليل');};
function dayLbl(d){ const k=Math.round((new Date(d)-new Date(D.today))/864e5); return ['النهاردة','بكرة','بعد بكرة'][k]||d; }
const slotTxt=s=>s?dayLbl(s.day)+' من '+hl(s.from)+' لـ'+hl(s.to):'';
const PIN='<svg class="pinI" viewBox="0 0 24 30"><path d="M12 29s10-9 10-17a10 10 0 0 0-20 0c0 8 10 17 10 17z" fill="#F2762E" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="3.6" fill="#fff"/></svg>';
function toast(t,bad){const e=$('toast');e.textContent=t;e.className='toast on'+(bad?' bad':'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='toast'+(bad?' bad':''),2800);}
function sheet(html,after){$('shBody').innerHTML=html;$('sh').className='open';if(after)setTimeout(after,30);}
function close(){$('sh').className='';}
$('shBg').onclick=close; document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});

async function call(fn,args,okMsg){
  if(busy) return; busy=true;
  try{ const r=await rpc(fn,args); if(r&&r.state) D=r; close(); render(); if(okMsg) toast(okMsg); try{ if(parent!==window) parent.postMessage('dx-sync','*'); }catch(_){} }
  catch(e){ toast(e.message,true); }
  finally{ busy=false; }
}
async function load(){
  try{ D=await rpc('rpc_track_get',{p_token:tok}); render(); }
  catch(e){ if(!D) show('<div class="card hero-msg"><div class="em">📶</div><h2>مش قادرين نفتح الصفحة</h2><p>اتأكد من النت وجرّب تاني.</p></div>'); }
}
// أول عرض بس فيه أنيميشن الدخول — التحديث كل ٢٠ ثانية بيبقى هادي
function show(h){ const a=$('app'); a.innerHTML=h; if(first){ a.classList.add('in'); [...a.children].forEach((c,i)=>c.style.setProperty('--i',i)); first=false; } else a.classList.remove('in'); }

// ── الخريطة اللي فوق ──
function heroMap(){
  const editable=D.can_edit, ll=D.loc?[+D.loc.lat,+D.loc.lng]:null;
  if(!hmap){
    hmap=L.map('hmap',{zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,boxZoom:false,keyboard:false,tap:false});
    hmap.setView(ll||[30.0444,31.2357],ll?16:11);
    hmap.attributionControl.setPosition('topleft'); dxBaseMap(hmap,false);
    setTimeout(()=>{hmap.invalidateSize();$('hmap').classList.add('on');$('hsk').style.display='none';},350);
  } else if(ll) hmap.setView(ll,16,{animate:true});
  if(hmark){hmap.removeLayer(hmark);hmark=null;}
  if(ll) hmark=L.marker(ll,{icon:L.divIcon({html:PIN,className:'',iconSize:[34,44],iconAnchor:[17,44]})}).addTo(hmap);
  let b=$('setloc');
  if(!ll && editable){ if(!b){ b=document.createElement('button'); b.id='setloc'; b.className='setloc'; b.textContent='📍 حدّد مكان التسليم'; b.onclick=()=>locSheet(); $('hero').appendChild(b);} }
  else if(b) b.remove();
  $('hero').onclick=e=>{ if(editable && e.target.closest('#hmap')) locSheet(); };
}

function msg(em,t,p,extra){ return '<div class="card hero-msg"><div class="em">'+em+'</div><h2>'+t+'</h2><p>'+p+'</p></div>'+(extra||''); }
function events(){ if(!D.events||!D.events.length) return ''; return '<div class="card"><b style="font-size:14px">اللي حصل</b><ul class="ev">'+D.events.map(e=>'<li><b>'+esc(e.txt)+'</b> · '+new Date(e.at).toLocaleString('ar-EG',{weekday:'short',hour:'numeric',minute:'2-digit'})+'</li>').join('')+'</ul></div>'; }
function supportBtn(){ return '<a class="btn b-ghost" style="display:block;text-align:center;text-decoration:none" href="tel:'+esc(D.support)+'">📞 كلّم خدمة العملاء</a>'; }
function amount(){ return '<div class="card"><div class="amt"><div><small>المبلغ المطلوب</small><small style="margin-top:2px">'+esc(D.due_note)+'</small></div><div class="big">'+fmt(D.due)+'<em>ج</em></div></div>'+
  '<div class="row"><span>من</span><b>'+esc(D.company)+'</b></div><div class="row"><span>فتح الشحنة</span><b>مسموح قبل الدفع ✓</b></div></div>'; }
function steps(){
  const s=D.state, n={store:2,way:3,postponed:3,carrier:3,delivered:4,partial:4}[s]||1;
  const L=[['📦','اتسجّلت'],['🏬','في المخزن'],['🛵','مع المندوب'],['✅','اتسلّمت']];
  return '<div class="card"><div class="steps"><i id="bar"></i>'+L.map((x,i)=>'<div class="st'+(i<n?' done':'')+(i===n-1&&n<4?' now':'')+'"><b>'+(i<n-1||n===4?'✓':x[0])+'</b>'+x[1]+'</div>').join('')+'</div></div>';
}
function optRow(k,ic,t,sub,set,editable,req){
  return '<div class="card opt'+(set?' set':'')+'"><div class="ic">'+ic+'</div><div><span class="t">'+t+'</span>'+(req?(!set&&editable?'<span class="req">مطلوب</span>':''):'<span class="tag">اختياري</span>')+'<small>'+sub+'</small></div>'+
    (editable?'<button class="link" id="e-'+k+'">'+(set?'غيّر':(k==='loc'?'حدّد':'ضيف'))+'</button>':((D.confirmed||D.cancel_pending)?'<span class="lk">🔒</span>':''))+'</div>';
}
function greet(sub){ return '<div class="hi"><h1>أهلاً <span>'+esc(D.name)+'</span> 👋</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div>'; }

function render(){
  const s=D.state;
  if(s==='bad'||s==='expired'){ $('hero').style.display='none'; document.querySelector('.wrap').style.marginTop='18px';
    show(s==='bad'?msg('🔗','اللينك مش شغّال','اتأكد إنك فتحت اللينك كامل زي ما وصلك في الرسالة.'):msg('🔒','اللينك ده خلص','عدّى ٣ أيام على الشحنة، فاللينك قفل لوحده عشان بياناتك تفضل محفوظة.')); return; }
  $('code').textContent=D.code||''; $('code').style.display='';
  heroMap();
  const paidRow=v=>'<div class="card"><div class="row"><span>اتدفع</span><b>'+v+'</b></div><div class="row"><span>من</span><b>'+esc(D.company)+'</b></div></div>';
  let h;
  if(s==='delivered'||s==='partial'){
    h=greet('')+steps()+msg('✅', s==='partial'?'اتسلّم جزء من الشحنة':'اتسلّمت', s==='partial'?'استلمت '+fmt(D.items_delivered||0)+' من '+fmt(D.items_total)+'، والباقي راجع لـ'+esc(D.company)+'.':'شكرًا إنك اخترت '+esc(D.company)+'.');
    h+=paidRow(fmt(D.collected)+' ج')+rateBox()+'<p class="hint">🔒 اللينك ده هيقفل لوحده بعد ٣ أيام</p>';
    show(h); bindRate(); anim(); return;
  }
  if(s==='returned'){ show(greet('')+msg('↩️','الشحنة رجعت للتاجر', D.collected>0?'الشحنة ما اتسلّمتش، ودفعت مصاريف التوصيل بس.':'الشحنة ما اتسلّمتش ورجعت لـ'+esc(D.company)+'.', paidRow(D.collected>0?fmt(D.collected)+' ج (التوصيل)':'مفيش'))+supportBtn()); return; }
  if(s==='cancelled'){ show(greet('')+msg('🛑','الشحنة اتلغت','اتلغت بناءً على طلبك ورجعت لـ'+esc(D.company)+'. ماتحتاجش تعمل حاجة.')); return; }
  if(s==='problem'){ show(greet('')+msg('⏳','فيه تأخير في شحنتك','فريقنا بيتابع الشحنة وهيكلّمك قريب. مش هتدفع حاجة غير لما تستلم.')+supportBtn()); return; }
  if(s==='carrier'){ show(greet('شحنتك مع شريك التوصيل')+steps()+msg('🚛','شحنتك مع شريك التوصيل','اتسلّمت لشركة شحن شريكة في محافظتك، وهتوصلك خلال ١–٣ أيام.')+amount()+supportBtn()+events()); anim(); return; }

  // ── قبل التسليم: store / way / postponed ──
  h=greet(s==='store'?'شحنتك عندنا وهتخرج قريب':s==='postponed'?'شحنتك اتأجّلت':'شحنتك مع المندوب وجاية لك');
  h+=steps();
  if(D.cancel_pending) h+='<div class="banner g">✓ تم إرسال طلب الإلغاء بنجاح</div>';
  else if(D.can_edit_slot && D.confirmed) h+='<div class="banner y">📅 '+(s==='postponed'?'الشحنة اتأجّلت':'الشحنة رجعت المخزن وهتخرج تاني')+'. اختار ميعاد جديد من «ميعاد التوصيل» تحت. باقي بياناتك زي ما هي.</div>';
  if(D.is_exchange) h+='<div class="banner i">🔄 دي شحنة <b>استبدال</b>: المندوب هيسلّمك الجديدة ويستلم منك <b>'+fmt(D.pickup_qty)+' قطعة</b>. جهّزهم قبل ما يوصل.</div>';
  if(D.paid_direct) h+='<div class="banner g">💳 المنتج مدفوع قبل كده. هتدفع للمندوب التوصيل بس.</div>';
  if(D.courier) h+='<div class="card courier"><div class="av">'+esc((D.courier.name||'؟')[0])+'</div><div class="who"><b>'+esc(D.courier.name)+'</b><small>المندوب بتاعك</small></div><a class="call" aria-label="اتصل بالمندوب" href="tel:'+esc(D.courier.phone)+'">📞</a></div>';
  h+=amount();
  const ed=D.can_edit, es=D.can_edit_slot;
  h+='<div class="sec">'+(D.confirmed?'بياناتك <small>اتأكدت واتقفلت 🔒</small>':'كمّل بياناتك الأول <small>وبعدين أكّد الاستلام تحت</small>')+'</div>';
  h+=optRow('loc','📍','مكان التسليم', D.loc?esc(D.loc.text||'اتحدّد على الخريطة')+(D.loc.src==='prev'&&ed?'<span class="prev">من آخر طلب ليك — لو اتغيّر دوس «غيّر»</span>':''):'مش لازم تكون في البيت — حدّد أي مكان يناسبك', !!D.loc, ed, true);
  h+=optRow('slot','🕒','ميعاد التوصيل', D.slot?slotTxt(D.slot):'خلال اليوم — لو مش هتبقى موجود اختار ميعاد', !!D.slot, es);
  h+=optRow('note','📝','تعليمات للمندوب', D.note?esc(D.note):'زي: كلّمني قبل ما توصل، أو سيبها مع البواب', !!D.note, ed);
  h+=optRow('ph2','📱','رقم تاني للتواصل', D.phone2?esc(D.phone2)+(D.phone2_name?' ('+esc(D.phone2_name)+')':''):'لو موبايلك مقفول، المندوب يكلّم الرقم ده', !!D.phone2, ed);
  if(D.can_confirm) h+='<div><button class="btn '+(D.loc?'b-ok':'b-flame')+'" id="bYes">'+(D.loc?'✓ تأكيد الاستلام':'حدّد المكان الأول عشان تأكّد')+'</button><p class="hint">بعد التأكيد البيانات اللي فوق بتتقفل.<br>اتأكد إن المكان والرقم صح.</p></div>';
  else if(D.confirmed && !D.cancel_pending) h+='<div class="banner g" style="text-align:center">✓ أكّدت الاستلام — لو محتاج تغيّر حاجة كلّم المندوب</div>';
  if(D.can_cancel) h+='<div class="danger"><p>مش عايز الشحنة خالص؟</p><button class="cx" id="bNo">الغي الشحنة</button></div>';
  h+=events();
  show(h); anim();
  const b=(id,f)=>{const e=$(id); if(e) e.onclick=f;};
  b('e-loc',locSheet); b('e-slot',slotSheet); b('e-note',noteSheet); b('e-ph2',ph2Sheet); b('bYes',confirmSheet); b('bNo',cancelSheet);
}
// شريط الخطوات بيتملى بالتدريج
function anim(){ const bar=$('bar'); if(!bar) return; const n=document.querySelectorAll('.st.done').length; requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.width=(Math.max(0,n-1)/3*76)+'%'; })); }

// ── بحث وعناوين بالعربي (Photon — مجاني) ──
function placeName(p){ return [p.name,p.street&&(p.street+(p.housenumber?' '+p.housenumber:'')),p.district||p.locality,p.city||p.county].filter((x,i,a)=>x&&a.indexOf(x)===i).slice(0,3).join('، '); }
function locSheet(){
  sheet('<h3>فين نسلّمك الشحنة؟</h3><p>حرّك الخريطة لحد ما الدبوس ييجي على المكان، أو ابحث، أو استخدم موقعك.</p>'+
    '<button class="btn b-ghost gps" id="gps">📍 استخدم موقعي الحالي</button>'+
    '<input type="text" id="q" placeholder="ابحث: الشارع، المنطقة، علامة مميزة" autocomplete="off"><div class="sg" id="sg"></div>'+
    '<div id="map"><svg class="pin" viewBox="0 0 24 30"><path d="M12 29s10-9 10-17a10 10 0 0 0-20 0c0 8 10 17 10 17z" fill="#F2762E" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="12" r="3.5" fill="#fff"/></svg></div>'+
    '<button class="btn b-flame" id="pOk">أكّد المكان ده</button>', ()=>{
    const c=D.loc?[+D.loc.lat,+D.loc.lng]:[30.0444,31.2357];
    const m=L.map('map',{zoomControl:false}).setView(c,D.loc?17:12);
    dxBaseMap(m,false);
    setTimeout(()=>m.invalidateSize(),120);
    $('gps').onclick=()=>{ if(!navigator.geolocation){toast('الموبايل مش بيدعم تحديد الموقع',true);return;}
      $('gps').textContent='بنحدّد موقعك…';
      navigator.geolocation.getCurrentPosition(p=>{m.setView([p.coords.latitude,p.coords.longitude],17);$('gps').textContent='📍 استخدم موقعي الحالي';},
        ()=>{toast('مش قادرين نحدد موقعك، جرّب البحث أو حرّك الخريطة',true);$('gps').textContent='📍 استخدم موقعي الحالي';},{enableHighAccuracy:true,timeout:10000}); };
    let tm; $('q').oninput=function(){ clearTimeout(tm); const v=this.value.trim(); if(v.length<3){$('sg').innerHTML='';return;}
      tm=setTimeout(async()=>{ try{ const ctr=m.getCenter();
        const r=await fetch('https://photon.komoot.io/api/?limit=8&lang=default&lat='+ctr.lat.toFixed(4)+'&lon='+ctr.lng.toFixed(4)+'&q='+encodeURIComponent(v)); const j=await r.json();
        const f=(j.features||[]).filter(x=>(x.properties.countrycode||'EG')==='EG').slice(0,5);
        $('sg').innerHTML=f.length?'':'<p class="hint">مفيش نتايج، جرّب كلمة تانية أو حرّك الخريطة</p>';
        f.forEach(x=>{const bt=document.createElement('button');bt.textContent=placeName(x.properties)||'مكان';bt.onclick=()=>{m.setView([x.geometry.coordinates[1],x.geometry.coordinates[0]],17);$('sg').innerHTML='';};$('sg').appendChild(bt);});
      }catch(e){} },500); };
    $('pOk').onclick=async()=>{ const p=m.getCenter(); let txt='مكان على الخريطة';
      $('pOk').disabled=true; $('pOk').textContent='لحظة…';
      try{ const r=await fetch('https://photon.komoot.io/reverse?lang=default&lat='+p.lat+'&lon='+p.lng); const j=await r.json();
        const n=j.features&&j.features[0]&&placeName(j.features[0].properties); if(n) txt=n; }catch(e){}
      await call('rpc_track_update',{p_token:tok,p:{loc_lat:+p.lat.toFixed(6),loc_lng:+p.lng.toFixed(6),loc_text:txt}},'المكان وصل للمندوب');
      const b=$('pOk'); if(b){b.disabled=false;b.textContent='أكّد المكان ده';} };
  });
}
function slotSheet(){
  const days=[0,1,2].map(i=>{const d=new Date(D.today+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+i);return d.toISOString().slice(0,10);});
  let day=days[0];
  const opts=(a,b,sel)=>{let o='';for(let x=a;x<=b;x++)o+='<option value="'+x+'"'+(x===sel?' selected':'')+'>'+hl(x)+'</option>';return o;};
  sheet('<h3>عايزها إمتى؟</h3><p>اختار اليوم والوقت اللي تكون فيه موجود (لحد يومين).</p>'+
    '<div class="chips" id="dd">'+days.map((d,i)=>'<button class="chip" aria-pressed="false" data-v="'+d+'">'+['النهاردة','بكرة','بعد بكرة'][i]+'</button>').join('')+'</div>'+
    '<div class="ft"><select id="hf" aria-label="من الساعة"></select><span>لـ</span><select id="ht" aria-label="لحد الساعة"></select></div>'+
    '<button class="btn b-flame" id="sOk">أكّد الميعاد</button>',()=>{
    const chips=[...document.querySelectorAll('#dd .chip')];
    const fill=()=>{ const min=day===days[0]?Math.max(10,D.hour+1):10;
      $('hf').innerHTML=opts(min,21,Math.min(Math.max(min,16),21)); $('ht').innerHTML=opts(min+1,22,Math.min(Math.max(min+3,19),22));
      chips.forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.v===day))); };
    if(Math.max(10,D.hour+1)>21){ chips[0].disabled=true; day=days[1]; }
    fill();
    chips.forEach(c=>c.onclick=()=>{ if(c.disabled) return; day=c.dataset.v; fill(); });
    $('sOk').onclick=()=>{const f=+$('hf').value,t=+$('ht').value; if(t<=f){toast('«لحد الساعة» لازم تكون بعد «من الساعة»',true);return;}
      call('rpc_track_update',{p_token:tok,p:{slot_day:day,slot_from:f,slot_to:t}},'الميعاد وصل للمندوب');};
  });
}
function noteSheet(){
  sheet('<h3>تعليمات للمندوب</h3><p>هتظهر له على الشحنة بتاعتك.</p><div class="chips" id="nq"><button class="chip">كلّمني قبل ما توصل</button><button class="chip">سيبها مع البواب</button><button class="chip">رن الجرس مرتين</button></div>'+
    '<textarea id="nt" maxlength="300" placeholder="البيت جنب صيدلية النور، الباب الأخضر">'+esc(D.note||'')+'</textarea><button class="btn b-flame" id="nOk">احفظ</button>',()=>{
    document.querySelectorAll('#nq .chip').forEach(c=>c.onclick=()=>{const t=$('nt');t.value=(t.value?t.value+' · ':'')+c.textContent;});
    $('nOk').onclick=()=>call('rpc_track_update',{p_token:tok,p:{note:$('nt').value}},'التعليمات وصلت للمندوب');
  });
}
function ph2Sheet(){
  sheet('<h3>رقم تاني للتواصل</h3><p>لو موبايلك مقفول، المندوب والإدارة يكلّموا الرقم ده.</p>'+
    '<label class="lbl" for="p2">رقم الموبايل</label><input type="tel" id="p2" dir="ltr" inputmode="tel" placeholder="01x xxxx xxxx" value="'+esc(D.phone2||'')+'">'+
    '<label class="lbl" for="p2n">صاحب الرقم (اختياري)</label><input type="text" id="p2n" maxlength="40" placeholder="مثلاً: أخويا أحمد" value="'+esc(D.phone2_name||'')+'">'+
    '<button class="btn b-flame" id="pOk2">احفظ الرقم</button>',()=>{
    $('pOk2').onclick=()=>{const v=$('p2').value.replace(/\s/g,''); if(v&&!/^01[0125]\d{8}$/.test(v)){toast('اكتب رقم موبايل صح: ١١ رقم ويبدأ بـ01',true);return;}
      call('rpc_track_update',{p_token:tok,p:{phone2:v,phone2_name:$('p2n').value}},'الرقم اتحفظ');};
  });
}
function confirmSheet(){
  if(!D.loc){ locSheet(); return; }
  const v=(x,e)=>x?'<b>'+esc(x)+'</b>':'<b style="color:var(--mute);font-weight:600">'+e+'</b>';
  sheet('<h3>راجع قبل ما تأكّد</h3><p>بعد التأكيد مش هتقدر تعدّل البيانات دي من الصفحة.</p><div class="sum">'+
    '<div><span>المكان</span>'+v(D.loc.text,'—')+'</div><div><span>الميعاد</span>'+v(D.slot&&slotTxt(D.slot),'خلال اليوم')+'</div>'+
    '<div><span>التعليمات</span>'+v(D.note,'مفيش')+'</div><div><span>رقم تاني</span>'+v(D.phone2,'مفيش')+'</div></div>'+
    '<button class="btn b-ok" id="cOk">أيوه، أكّد الاستلام</button><button class="btn b-ghost" id="cBack" style="margin-top:8px">ارجع عدّل</button>',()=>{
    $('cBack').onclick=close; $('cOk').onclick=()=>call('rpc_track_confirm',{p_token:tok},'تمام، المندوب عرف إنك مستنيه');
  });
}
function cancelSheet(){
  let why='';
  sheet('<h3>عايز تلغي الشحنة؟</h3><p>قولّنا السبب.</p>'+
    '<div class="chips" id="rq">'+['غيّرت رأيي','طلبتها بالغلط','السعر مختلف','اتأخرت عليّا','سبب تاني'].map(x=>'<button class="chip" aria-pressed="false">'+x+'</button>').join('')+'</div>'+
    '<textarea id="ow" maxlength="180" placeholder="اكتب السبب (اختياري)" style="display:none"></textarea>'+
    '<button class="btn b-ghost" id="rBack">لأ، أنا عايزها</button><button class="btn b-bad" id="rOk" style="margin-top:8px">كمّل الإلغاء</button>',()=>{
    document.querySelectorAll('#rq .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#rq .chip').forEach(x=>x.setAttribute('aria-pressed','false'));c.setAttribute('aria-pressed','true');why=c.textContent;$('ow').style.display=why==='سبب تاني'?'block':'none';});
    $('rBack').onclick=close;
    $('rOk').onclick=()=>{ if(!why){toast('اختار السبب الأول',true);return;}
      const full=why+(why==='سبب تاني'&&$('ow').value.trim()?': '+$('ow').value.trim():'');
      sheet('<h3>متأكد؟</h3><p>هيتبعت طلب إلغاء للشحنة.</p><div class="sum"><div><span>السبب</span><b>'+esc(full)+'</b></div></div>'+
        '<button class="btn b-ok" id="fNo">لأ، رجّعني</button><button class="btn b-badx" id="fYes" style="margin-top:8px">أيوه، الغي الشحنة</button>',()=>{
        $('fNo').onclick=close; $('fYes').onclick=()=>call('rpc_track_cancel',{p_token:tok,p_reason:full},'تم إرسال طلب الإلغاء بنجاح');
      });
    };
  });
}
let stars=0;
function rateBox(){
  if(!D.can_rate) return (D.rating||D.feedback)?'<div class="banner g" style="text-align:center">شكرًا، رأيك وصل 🙏</div>':'';
  return '<div class="card" style="text-align:center"><b>رأيك يهمّنا</b><div class="stars" id="st">'+[1,2,3,4,5].map(i=>'<button aria-label="'+i+' من ٥" data-i="'+i+'">★</button>').join('')+'</div>'+
    '<textarea id="fb" maxlength="500" placeholder="عايز تقول حاجة عن الشحنة؟ (اختياري)"></textarea><button class="btn b-flame" id="fbOk">ابعت رأيك</button></div>';
}
function bindRate(){
  const st=$('st'); if(!st) return;
  st.querySelectorAll('button').forEach(b=>b.onclick=()=>{stars=+b.dataset.i;st.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.i<=stars));});
  $('fbOk').onclick=()=>{ if(!stars&&!$('fb').value.trim()){toast('قيّم أو اكتب رأيك الأول',true);return;}
    call('rpc_track_feedback',{p_token:tok,p_rating:stars||null,p_text:$('fb').value},'رأيك وصل، شكرًا ليك'); };
}
load();
// تحديث هادي كل ٢٠ ثانية (من غير أنيميشن)
addEventListener('message',e=>{ if(e.data==='dx-reload' && !$('sh').className && !busy) load(); });
setInterval(()=>{ if(!document.hidden && !$('sh').className && !busy && !(document.activeElement&&document.activeElement.id==='fb')) load(); },20000);
})();
</script>
</body>
</html>
