<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>🧪 [تجريبي] تطبيق المندوب — Dragon Express</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="dx.css">
<style>
body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:78px}
.sheet{max-width:480px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.bar img{width:34px;height:34px;border-radius:9px}
.bar h1{font-size:16px;margin:0;font-weight:900}.bar p{margin:0;font-size:11.5px;color:var(--mut)}
.who{background:#1B1200;color:#F2C14E;border:1px solid #6b5418;border-radius:8px;padding:1px 4px;font-family:inherit;font-weight:800;font-size:11.5px}
.main{padding:8px 12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.oc{display:flex;align-items:flex-start;margin-bottom:9px;cursor:pointer;transition:border-color .15s}
.oc:hover{border-color:var(--line2)}
.age{width:3px;height:52px;border-radius:3px;margin-left:10px;flex:none}
.rank{width:22px;height:22px;border-radius:50%;background:var(--surf2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:900;color:var(--mut);margin-left:7px;flex:none}
.oc .nm{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .sub{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .amt{font-size:16px;font-weight:900;color:var(--acc)}
.sec{margin:16px 2px 8px;font-size:12px;font-weight:800;color:var(--mut)}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--bg2);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px 10px;z-index:40}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--mut2)}
.nav button b{font-size:19px;line-height:1.2}.nav .on{color:var(--acc)}
.nav .on b{background:rgba(245,146,43,.14);border-radius:14px;padding:0 14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
</style>
</head>
<body>
<div class="testbar">🧪 تجريبي — تطبيق المندوب · انت دلوقتي: <select id="who" class="who"></select></div>
<div class="bar"><img src="logo.webp" alt=""><div style="flex:1"><h1 id="hello">أهلاً</h1><p>مندوب · Dragon Express</p></div><button class="round" id="rf" title="تحديث">🔄</button></div>
<div class="main" id="app"><div class="empty">بيحمّل…</div></div>
<nav class="nav"><button class="on"><b>🛵</b>تسليم</button><button data-x><b>📥</b>استلام</button><button data-x><b>🔄</b>تحويل</button><button data-x><b>👤</b>حسابي</button></nav>
<div class="shbg" id="shBg"></div><div class="sheet"><div class="grab"></div><div id="shBody"></div></div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="dx.js"></script>
<script>
let P=null, ME=localStorage.getItem('dx-courier')||'', CUR=null, SUB=false;
const ACTIVE=['with_courier','postponed','partial'];
const due=o=>o.status==='partial'?Math.max(0,o.cod-(o.collected||0)):o.cod;
const ageDays=o=>Math.max(0,Math.floor((Date.now()-new Date(o.status_at||Date.now()))/864e5));
async function load(){
  try{ P=await rpc('test_panel'); }catch(e){ $('app').innerHTML='<div class="empty">❌ '+esc(e.message)+'</div>'; return; }
  const ks=P.couriers||[]; if(!ks.find(k=>k.id===ME)) ME=(ks.find(k=>k.name.startsWith('كريم'))||ks[0]||{}).id||'';
  $('who').innerHTML=ks.map(k=>'<option value="'+k.id+'"'+(k.id===ME?' selected':'')+'>'+esc(k.name)+'</option>').join('');
  draw(); if(CUR && document.body.classList.contains('open')) openOrder(CUR,true);
}
function draw(){
  const me=(P.couriers||[]).find(k=>k.id===ME)||{name:'—'};
  $('hello').textContent='أهلاً، '+me.name.split(' ')[0];
  const mine=(P.orders||[]).filter(o=>o.courier_id===ME);
  const act=mine.filter(o=>ACTIVE.includes(o.status)).sort((a,b)=>(b.cancel==='pending')-(a.cancel==='pending')||(b.confirmed-a.confirmed));
  const done=mine.filter(o=>!ACTIVE.includes(o.status));
  const ready=act.filter(o=>o.confirmed&&o.loc).length;
  let h='<div class="sum"><div class="kpi"><div class="lbl">💵 معاك تحصيل</div><div class="v">'+fmt(act.reduce((s,o)=>s+due(o),0))+'<small>ج</small></div></div>'+
        '<div class="kpi newfeat"><div class="lbl">📍 جاهزين (أكّدوا + المكان)</div><div class="v" style="color:var(--ok)">'+fmt(ready)+'<small>من '+fmt(act.length)+'</small></div></div></div>';
  if(!act.length) h+='<div class="card empty">مفيش أوردرات معاك دلوقتي 🎉<br><span class="small">من شاشة الأدمن اطلع شحنة مع المندوب ده</span></div>';
  h+=act.map((o,i)=>card(o,i+1)).join('');
  if(done.length) h+='<div class="sec">خلّصتها — '+fmt(done.length)+'</div>'+done.map(o=>card(o,null,true)).join('');
  $('app').innerHTML=h;
}
function card(o,rank,dim){
  const a=ageDays(o), ac=a>=4?'var(--bad)':a>=2?'var(--warn)':'var(--ok)', sw=o.is_exchange;
  const edge=o.cancel==='pending'?'rgba(240,85,95,.6)':sw?'rgba(168,121,247,.55)':'';
  const tags=[pill(o.status), tag(o.code,null,'mono')];
  if(sw) tags.push(tag('🔁 استبدال — استلم '+fmt(o.pickup_qty)+' قطعة','#A879F7'));
  if(o.attempts>0) tags.push(tag('محاولة '+fmt(o.attempts)+'/٣','#F2C14E'));
  // ★ الجديد
  if(o.cancel==='pending') tags.push(tag('🛑 طلب إلغاء — استنى الإدارة','#F0555F'));
  if(o.confirmed) tags.push(tag('✓ أكّد الاستلام','#5EE6A8'));
  else if(o.link_sent && ACTIVE.includes(o.status)) tags.push(tag('⏳ لسه ماأكّدش','#F2C14E'));
  else if(ACTIVE.includes(o.status)) tags.push(tag('💬 ابعتله اللينك','#8FA6C0'));
  if(o.loc) tags.push(tag('📍 حدّد مكانه','#4A9BEA'));
  if(o.slot_day) tags.push(tag('⏰ '+slotTxt(o),'#F2C14E'));
  if(o.note) tags.push(tag('📝 فيه تعليمات','#F9A040'));
  return '<div class="card tight oc" data-o="'+o.code+'" style="'+(edge?'border-color:'+edge+';':'')+(dim?'opacity:.6':'')+'">'+
    '<div class="age" style="background:'+(dim?'var(--line2)':ac)+'"></div>'+(rank?'<div class="rank">'+fmt(rank)+'</div>':'')+
    '<div style="flex:1;min-width:0"><div class="nm">'+esc(o.customer)+'</div><div class="sub">'+esc(o.area)+' • '+esc(o.company)+'</div>'+
    '<div class="sub">📍 '+esc(o.loc||o.address)+'</div><div class="wrap" style="margin-top:7px">'+tags.join('')+'</div></div>'+
    '<div style="margin-right:8px;text-align:left;flex:none"><div class="amt">'+fmt(due(o))+'</div><div class="small mut">ج</div><div style="font-size:10px;font-weight:800;color:'+ac+'">'+(dim?'':fmt(a)+' يوم')+'</div></div></div>';
}
function openOrder(code,keep){
  const o=P.orders.find(x=>x.code===code); if(!o) return closeSheet(); CUR=code; SUB=false;
  const live=ACTIVE.includes(o.status)&&o.courier_id===ME, block=o.cancel==='pending';
  let h='<div style="display:flex;gap:8px;align-items:flex-start"><div style="flex:1"><div style="font-size:19px;font-weight:900">'+esc(o.customer)+'</div><div class="small mut">'+esc(o.area)+' • '+esc(o.company)+' • '+o.code+'</div></div>'+pill(o.status)+'</div>';
  h+='<div class="sum" style="margin-top:12px"><div class="kpi"><div class="lbl">💵 التحصيل</div><div class="v" style="color:var(--acc)">'+fmt(due(o))+'<small>ج</small></div>'+(o.paid_direct?'<div class="small mut">المنتج مدفوع — التوصيل بس</div>':o.is_exchange?'<div class="small mut">استبدال — التوصيل بس</div>':'')+'</div><div class="kpi"><div class="lbl">👛 عمولتي</div><div class="v" style="color:var(--ok)">'+fmt(o.commission)+'<small>ج</small></div></div></div>';
  h+=custCard(o,'courier');
  h+='<div class="card tight" style="margin-top:10px"><div class="lbl">📍 العنوان (من التاجر)</div><div style="font-weight:700;line-height:1.6;margin-top:3px">'+esc(o.address)+' — '+esc(o.area)+'</div>'+
     (o.phones||[]).map((p,i)=>'<div class="hline"></div><div style="display:flex;align-items:center;gap:8px"><div style="flex:1"><div class="lbl">'+(i?'رقم بديل':'تليفون العميل')+'</div><b class="mono">'+esc(p)+'</b></div><a class="round wa" target="_blank" rel="noopener" href="https://wa.me/2'+esc(p)+'">💬</a><a class="round" href="tel:'+esc(p)+'">📞</a></div>').join('')+'</div>';
  if(o.status==='partial') h+='<div class="card tight" style="margin-top:10px;border-color:rgba(168,121,247,.5);background:rgba(168,121,247,.06)"><b style="color:var(--purple);font-size:12.5px">➗ اتسلّم جزء — والباقي لسه معاك</b><div class="small mut" style="margin-top:4px">اتسلّم '+fmt(o.items_delivered)+' من '+fmt(o.items_total)+' قطعة، ومحصّل '+fmt(o.collected)+' ج.</div></div>';
  if(live){
    h+=(block?'<p class="small" style="color:#ffb3b8;font-weight:800;margin:12px 2px 0">الأزرار مقفولة لحد ما الإدارة ترد على طلب الإلغاء.</p>':'')+
     '<div class="acts"><button class="big" style="background:var(--ok)" data-a="ok"'+(block?' disabled':'')+'>✅ سلّمت</button>'+
     '<button class="big" style="background:var(--purple)" data-a="part"'+(block||o.items_total<2||o.status==='partial'?' disabled':'')+'>➗ سلّمت جزء</button>'+
     '<button class="big out" style="color:var(--warn)" data-a="pp">⏸️ مأجل</button>'+
     '<button class="big out" style="color:var(--bad)" data-a="ret">↩️ مرتجع</button></div>'+
     '<button class="btn" style="margin:12px auto 0;display:flex;background:none;border:0;color:var(--mut)" data-a="lost">⚠️ الأوردر ضاع أو اتسرق؟</button>';
  }
  h+=(o.events&&o.events.length?'<div class="card tight fill2" style="margin-top:12px"><div class="lbl">🕑 اللي حصل</div>'+o.events.map(e=>'<div class="small" style="padding:2px 0">• '+esc(e)+'</div>').join('')+'</div>':'');
  if(!keep||!document.body.classList.contains('open')) openSheet(h); else $('shBody').innerHTML=h;
  initMaps($('shBody'));
}
function sub(html){ SUB=true; $('shBody').innerHTML=html; }
async function doAct(a){
  const o=P.orders.find(x=>x.code===CUR); if(!o) return;
  if(a==='send'){ const ok=await act('test_send_link',{p_code:o.code},'اتبعت للعميل على الواتساب (محاكاة) — والرسالة اتنسخت كمان'); if(ok&&navigator.clipboard) navigator.clipboard.writeText(waMsg(o)).catch(()=>{}); return openOrder(o.code,true); }
  if(a==='ok') return sub('<h3 style="margin:4px 0 6px">تأكيد التسليم</h3><p class="mut" style="line-height:1.8">'+(o.is_exchange?'سلّمت المنتج الجديد واستلمت <b>'+fmt(o.pickup_qty)+' قطعة</b> من العميل، و':'')+'استلمت <b style="color:var(--acc)">'+fmt(due(o))+' ج</b> من '+esc(o.customer)+'؟</p><div class="acts"><button class="big" style="background:var(--ok)" data-a="ok2">أيوه، سلّمت</button><button class="big out" style="color:var(--mut)" data-a="back">رجوع</button></div>');
  if(a==='ok2'){ await act('test_set_status',{p_code:o.code,p_status:'delivered',p_collected:o.status==='partial'?o.cod:null,p_items:o.items_total},'اتسجّل التسليم ✅'); CUR=null; return closeSheet(); }
  if(a==='part') return sub('<h3 style="margin:4px 0 10px">سلّمت جزء</h3><label class="lbl">استلم كام قطعة من '+fmt(o.items_total)+'؟</label><input id="pn" class="field" type="number" min="1" max="'+(o.items_total-1)+'" value="1" style="margin:4px 0 10px"><label class="lbl">دفع كام جنيه؟</label><input id="pm" class="field" type="number" value="'+Math.round(o.cod/2)+'" style="margin-top:4px"><div class="acts"><button class="big" style="background:var(--purple)" data-a="part2">سجّل</button><button class="big out" style="color:var(--mut)" data-a="back">رجوع</button></div>');
  if(a==='part2'){ const n=+$('pn').value, m=+$('pm').value; if(!(n>0&&n<o.items_total)) return toast('عدد القطع غلط',true); await act('test_set_status',{p_code:o.code,p_status:'partial',p_collected:m,p_items:n},'اتسجّل تسليم جزئي'); return openOrder(o.code,true); }
  if(a==='pp'){ await act('test_postpone',{p_code:o.code},'اتأجّلت — والعميل هيقدر يختار ميعاد جديد'); return openOrder(o.code,true); }
  if(a==='ret') return sub('<h3 style="margin:4px 0 10px">مرتجع — العميل رفض</h3><div style="display:grid;gap:9px"><button class="big out" style="color:var(--warn)" data-a="ret1">رفض ودفع الشحن ('+fmt(o.ship)+' ج)</button><button class="big out" style="color:var(--bad)" data-a="ret0">رفض ومادفعش حاجة</button><button class="big out" style="color:var(--mut)" data-a="back">رجوع</button></div>');
  if(a==='ret1'||a==='ret0'){ await act('test_set_status',{p_code:o.code,p_status:'returned',p_collected:a==='ret1'?o.ship:0,p_items:null},'اتسجّل مرتجع'); CUR=null; return closeSheet(); }
  if(a==='lost'){ if(!confirm('تبلّغ إن الأوردر ضاع أو اتسرق؟ (تجريبي)')) return; await act('test_set_status',{p_code:o.code,p_status:'lost',p_collected:null,p_items:null},'اتبلّغ للإدارة'); CUR=null; return closeSheet(); }
  if(a==='back') return openOrder(o.code,true);
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.oc'); if(c) return openOrder(c.dataset.o);
  const b=e.target.closest('[data-a]'); if(b&&!b.disabled) return doAct(b.dataset.a);
  if(e.target.closest('[data-x]')) toast('الشاشة دي زي ما هي في التطبيق — مش جزء من التجربة');
});
$('shBg').onclick=()=>{closeSheet();CUR=null;};
$('who').onchange=e=>{ME=e.target.value;localStorage.setItem('dx-courier',ME);closeSheet();draw();};
$('rf').onclick=load;
// الشيت بيتحدّث وهو مفتوح كمان (إلا لو انت جوه تأكيد/إدخال)
addEventListener('message',e=>{ if(e.data==='dx-reload'&&CUR&&!SUB&&!BUSY) load(); });
load(); setInterval(()=>{ if(!document.hidden&&!SUB&&!BUSY) load(); },10000);
</script>
</body>
</html>
